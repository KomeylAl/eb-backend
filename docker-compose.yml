x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  APP_DEBUG: ${APP_DEBUG:-false}
  APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
  APP_URL: ${APP_URL:-http://localhost}
  DB_CONNECTION: ${DB_CONNECTION:-pgsql}
  DB_HOST: ${DB_HOST:?Set DB_HOST in .env (Postgres hostname on the infrastructure network)}
  DB_PORT: ${DB_PORT:-5432}
  DB_DATABASE: ${DB_DATABASE:?Set DB_DATABASE in .env}
  DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env}
  DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
  SESSION_DRIVER: ${SESSION_DRIVER:-database}
  QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}
  CACHE_STORE: ${CACHE_STORE:-database}
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SMS_IR_API_KEY: ${SMS_IR_API_KEY:-}
  SMS_IR_LINE_NUMBER: ${SMS_IR_LINE_NUMBER:-}
  SMS_IR_OTP_TTL_SECONDS: ${SMS_IR_OTP_TTL_SECONDS:-300}
  SMS_IR_OTP_RESEND_SECONDS: ${SMS_IR_OTP_RESEND_SECONDS:-60}

services:
  # One-off: run DB migrations, then exit.
  #   docker compose run --rm migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    env_file: .env
    environment:
      <<: *app-env
      SKIP_OPTIMIZE: "true"
    command: php artisan migrate --force
    restart: "no"
    networks:
      - infrastructure

  # Web app (FrankenPHP serves HTTP on 8080). The host's global nginx
  # reverse-proxies to 127.0.0.1:${APP_PORT}. No nginx inside the container.
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    env_file: .env
    environment:
      <<: *app-env
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    volumes:
      - uploads_data:/app/storage/app/public
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - infrastructure

  # Queue worker (queue connection is "database").
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    env_file: .env
    environment:
      <<: *app-env
      SKIP_OPTIMIZE: "true"
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    volumes:
      - uploads_data:/app/storage/app/public
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - infrastructure

  # Optional: migrate + seed.
  #   docker compose --profile seed run --rm seed
  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    env_file: .env
    environment:
      <<: *app-env
      SKIP_OPTIMIZE: "true"
    command: >
      sh -c "php artisan migrate --force
      && php artisan db:seed --force"
    restart: "no"
    networks:
      - infrastructure

volumes:
  uploads_data:

networks:
  infrastructure:
    external: true
